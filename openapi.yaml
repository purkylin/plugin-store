openapi: 3.1.0
info:
  title: Hawk Plugin Store API
  version: 1.0.0
servers:
  - url: https://hawk-plugin-store.example.workers.dev/api/v1
paths:
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Request an emailed password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Generic response regardless of account existence or throttling; email delivery is asynchronous
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password and revoke all existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                password_confirmation:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Password reset; sign in again
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: requestRegistration
      summary: Send an activation email for a new plugin author account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Activation email sent; account is created only after confirmation. No session cookie is issued.
          content:
            application/json:
              schema:
                type: object
                required: [message, verification_required]
                properties:
                  message:
                    type: string
                  verification_required:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/verify-email:
    post:
      operationId: verifyRegistration
      summary: Confirm email ownership and create the account without signing in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Single-use activation token from the email, valid for 30 minutes
      responses:
        "200":
          description: Account activated; sign in normally
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: loginUser
      summary: Sign in a plugin author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logoutUser
      summary: Revoke the current user session
      security:
        - userSession: []
      responses:
        "204":
          description: Signed out
  /user/submissions:
    get:
      operationId: listUserSubmissions
      summary: List the current user's public submissions, drafts, and private plugins
      security:
        - userSession: []
      responses:
        "200":
          description: Submission history
        "401":
          $ref: "#/components/responses/Error"
  /user/submissions/{submission_id}/cancel:
    post:
      operationId: cancelPluginSubmission
      summary: Cancel the current user's pending plugin submission
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/SubmissionID"
      responses:
        "200":
          description: Submission cancelled and available for editing
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /user/me:
    get:
      operationId: getCurrentUser
      summary: Get the current plugin author account
      security:
        - userSession: []
      responses:
        "200":
          description: Current user
        "401":
          $ref: "#/components/responses/Error"
  /plugin-types:
    get:
      operationId: listPluginTypes
      summary: List configured plugin type names and values
      responses:
        "200":
          description: Plugin types available when creating a plugin
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginType"
  /plugins/inspect:
    post:
      operationId: inspectPluginScript
      summary: Fetch and inspect metadata from a third-party plugin script URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Parsed plugin script metadata
          content:
            application/json:
              schema:
                type: object
                required: [platforms, raw_platforms]
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  author:
                    type: string
                  description:
                    type: string
                  homepage:
                    type: string
                  platforms:
                    type: array
                    items:
                      type: string
                  raw_platforms:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
  /user/plugins:
    post:
      operationId: submitNewPluginForReview
      summary: Submit a new plugin with a server-generated UUID for review
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: Whitelisted user submission accepted and published immediately
        "202":
          description: Waiting for review; the response includes the generated plugin_id
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /user/plugins/draft:
    post:
      operationId: saveNewPluginDraft
      summary: Save a new public draft or private plugin with a server-generated UUID
      description: visibility is fixed by this first save and cannot be changed later. Private plugins can be edited and exported but never submitted for review.
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: Draft saved without submitting it for review
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /user/plugins/import:
    post:
      operationId: importPluginDrafts
      summary: Import 1–100 new plugins as drafts
      description: Imported id, author, and update_time fields are ignored and replaced by the server.
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginImportRequest"
      responses:
        "201":
          description: Every plugin was validated and imported as a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginImportResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /user/plugins/submit-drafts:
    post:
      operationId: submitAllPluginDrafts
      summary: Submit all of the current user's drafts for administrator review
      description: Every public draft is validated before the batch is submitted; private plugins are excluded. A validation failure leaves all public drafts unchanged.
      security:
        - userSession: []
      responses:
        "202":
          description: All drafts were submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSubmissionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /user/plugins/{plugin_id}:
    put:
      operationId: submitPluginUpdateForReview
      summary: Submit an update to an owned plugin for administrator review
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/PluginID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: Whitelisted user update accepted and published immediately
        "202":
          description: Waiting for review
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOwnedPlugin
      summary: Permanently delete an owned plugin and all related data
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/PluginID"
      responses:
        "204":
          description: Plugin, releases, submissions, and review history deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /user/plugins/{plugin_id}/unpublish:
    post:
      operationId: unpublishOwnedPlugin
      summary: Remove the current user's published plugin from the store
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/PluginID"
      responses:
        "200":
          description: Plugin unpublished; releases and review history are preserved
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /user/plugins/{plugin_id}/draft:
    put:
      operationId: saveExistingPluginDraft
      summary: Save or replace an owned public draft or private plugin
      description: The visibility chosen when the plugin was created cannot be changed.
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/PluginID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Draft saved
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /plugins:
    get:
      operationId: listPlugins
      summary: List compatible published plugins
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [ios, tvos]
        - name: app_version
          in: query
          required: true
          schema:
            type: string
          example: 1.4.0
        - name: type
          in: query
          description: Filter by manifest plugin type
          schema:
            type: string
            maxLength: 100
        - name: q
          in: query
          description: Search plugin ID, name, or author
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [time, downloads]
            default: time
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: A page of compatible plugins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginPage"
        "400":
          $ref: "#/components/responses/Error"
  /plugins/check-updates:
    post:
      operationId: checkPluginUpdates
      summary: Check multiple installed plugins for compatible published updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckRequest"
      responses:
        "200":
          description: One result for every requested plugin, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResponse"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /plugins/{plugin_id}/manifest:
    get:
      operationId: getLatestPluginManifest
      summary: Download the latest published Hawk plugin manifest
      parameters:
        - $ref: "#/components/parameters/PluginID"
      responses:
        "200":
          description: A single Hawk plugin object
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
  /plugins/{plugin_id}/install-events:
    post:
      operationId: recordPluginInstallEvent
      summary: Idempotently record an install lifecycle event
      parameters:
        - $ref: "#/components/parameters/PluginID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallEvent"
      responses:
        "204":
          description: Recorded, or the event was recorded previously
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/plugins/{plugin_id}/unpublish:
    post:
      operationId: unpublishPlugin
      summary: Remove a published plugin from the store while preserving its history
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/PluginID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 2
                  maxLength: 500
      responses:
        "200":
          description: Plugin unpublished and returned to the author
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/plugins:
    get:
      operationId: listManagedPlugins
      summary: List published plugins with manifests and compatibility metadata
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A management page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPluginPage"
        "401":
          $ref: "#/components/responses/Error"
  /admin/plugin-types:
    get:
      operationId: listAdminPluginTypes
      summary: List plugin types for administration
      security:
        - adminToken: []
      responses:
        "200":
          description: Configured plugin types
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: upsertPluginType
      summary: Create a plugin type or update its display name
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginTypeRequest"
      responses:
        "200":
          description: Plugin type saved
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /admin/plugin-types/{value}:
    delete:
      operationId: deletePluginType
      summary: Delete an unused plugin type
      security:
        - adminToken: []
      parameters:
        - name: value
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9._-]{0,39}$"
      responses:
        "204":
          description: Plugin type deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The type is used by an existing plugin
  /admin/users/stats:
    get:
      operationId: getAdminUserStats
      summary: Get registered-user counts and the top five plugin contributors
      security:
        - adminToken: []
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStats"
        "401":
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users for whitelist management
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          description: Search email or nick
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: One-based result page
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Users per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Error"
  /admin/users/{user_id}/whitelist:
    put:
      operationId: setUserWhitelist
      summary: Enable or disable review-free publishing for a user
      security:
        - adminToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Whitelist status updated
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/reviews:
    get:
      operationId: listPendingReviews
      summary: List plugin submissions waiting for administrator review
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Pending review queue
        "401":
          $ref: "#/components/responses/Error"
  /admin/reviews/{submission_id}/accept:
    post:
      operationId: acceptPluginSubmission
      summary: Accept and publish a pending plugin submission
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/SubmissionID"
      responses:
        "200":
          description: Accepted and published
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/reviews/{submission_id}/reject:
    post:
      operationId: rejectPluginSubmission
      summary: Reject a pending plugin submission with a reason
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/SubmissionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 2
                  maxLength: 500
      responses:
        "200":
          description: Rejected
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /user/pushes/{push_id}/content:
    get:
      operationId: getUserPushContent
      summary: View the original submitted Python source or CMS configuration
      security:
        - userSession: []
      parameters:
        - name: push_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Original content, restricted to the owner or an administrator; never executed
          content:
            application/json:
              schema:
                type: object
                required: [name, resource_type, content]
                properties:
                  name:
                    type: [string, "null"]
                  resource_type:
                    type: string
                    enum: [py, cms]
                  content:
                    type: string
                  sha256:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "410":
          description: Historical upload is unavailable and no matching published version exists
  /admin/pushes/{push_id}/content:
    get:
      operationId: getAdminPushContent
      summary: View the original submitted Python source or CMS configuration
      security:
        - adminToken: []
      parameters:
        - name: push_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Original content, restricted to the owner or an administrator; never executed
          content:
            application/json:
              schema:
                type: object
                required: [name, resource_type, content]
                properties:
                  name:
                    type: [string, "null"]
                  resource_type:
                    type: string
                    enum: [py, cms]
                  content:
                    type: string
                  sha256:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "410":
          description: Historical upload is unavailable and no matching published version exists
  /user/pushes:
    get:
      operationId: listUserResourcePushes
      summary: List the signed-in user's resource Push history
      security:
        - userSession: []
      responses:
        "200": { description: Paginated Push history }
  /user/pushes/py:
    post:
      operationId: pushPythonResource
      summary: Push a Python file or a URL that the server downloads immediately
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                url: { type: string, format: uri }
                note: { type: string, maxLength: 500 }
                is_adult: { type: boolean, default: false }
      responses:
        "202": { description: Push queued for review }
        "409": { $ref: "#/components/responses/Error" }
  /user/pushes/cms:
    post:
      operationId: pushCMSResource
      summary: Push a named CMS URL
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 100 }
                url: { type: string, format: uri }
                note: { type: string, maxLength: 500 }
                is_adult: { type: boolean, default: false }
      responses:
        "202": { description: Push queued for review }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pushes:
    get:
      operationId: listPendingResourcePushes
      summary: List pending PY and CMS Pushes
      security:
        - adminToken: []
      responses:
        "200": { description: Pending resource Push queue }
  /admin/pushes/{push_id}/accept:
    post:
      operationId: acceptResourcePush
      summary: Accept a resource Push; the resulting resource starts disabled
      security:
        - adminToken: []
      parameters:
        - { name: push_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Push accepted }
  /admin/pushes/{push_id}/reject:
    post:
      operationId: rejectResourcePush
      summary: Reject a resource Push with a user-visible reason
      security:
        - adminToken: []
      parameters:
        - { name: push_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Push rejected }
  /admin/resources:
    get:
      operationId: listTVBoxResources
      summary: List PY and CMS resources with filters, sorting, and pagination
      security:
        - adminToken: []
      responses:
        "200": { description: Paginated resource list }
  /admin/resources/{type}/{resource_id}/enabled:
    put:
      operationId: setTVBoxResourceEnabled
      summary: Enable or disable a resource for the next generated configuration
      security:
        - adminToken: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [py, cms] } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Resource updated }
  /admin/resources/{type}/{resource_id}:
    delete:
      operationId: deleteTVBoxResource
      summary: Delete a PY or CMS resource without regenerating the TVBox configuration
      security:
        - adminToken: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [py, cms] } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Resource deleted; the TVBox configuration remains unchanged until manually regenerated }
  /admin/tvbox/settings:
    get:
      operationId: getTVBoxSettings
      security:
        - adminToken: []
      responses:
        "200": { description: Template and linked plugin settings }
    put:
      operationId: saveTVBoxSettings
      security:
        - adminToken: []
      responses:
        "200": { description: Settings saved }
  /admin/tvbox/generate:
    post:
      operationId: generateTVBoxConfig
      description: Generates the TVBox configuration, publishes a new linked-plugin release, and overwrites any public owner draft with that generated manifest. Pending reviews and submission history are not modified.
      summary: Replace the template sites field and write the generated config to R2
      security:
        - adminToken: []
      responses:
        "200": { description: Generation and optional plugin sync result }
  /admin/tvbox/retry-plugin-sync:
    post:
      operationId: retryTVBoxPluginSync
      security:
        - adminToken: []
      responses:
        "200": { description: Linked plugin sync result }
  /admin/settings/email:
    get:
      operationId: getEmailNotificationSetting
      summary: Read the global email notification switch
      security:
        - adminToken: []
      responses:
        "200": { description: Email notification setting }
    put:
      operationId: setEmailNotificationSetting
      summary: Enable or disable all Resend notifications
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Setting saved }
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
    userSession:
      type: apiKey
      in: cookie
      name: hawk_session
  parameters:
    PluginID:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,200}$"
    SubmissionID:
      name: submission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PluginType:
      type: object
      required: [value, name, created_at, updated_at]
      properties:
        value:
          type: string
          pattern: "^[a-z][a-z0-9._-]{0,39}$"
        name:
          type: string
          maxLength: 60
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PluginTypeRequest:
      type: object
      required: [value, name]
      properties:
        value:
          type: string
          pattern: "^[a-z][a-z0-9._-]{0,39}$"
        name:
          type: string
          minLength: 1
          maxLength: 60
    RegisterRequest:
      type: object
      required: [email, nick, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
        nick:
          type: string
          minLength: 2
          maxLength: 40
        password:
          type: string
          minLength: 8
          maxLength: 128
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PluginPage:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    Plugin:
      type: object
      required:
        - id
        - name
        - description
        - author
        - latest_version
        - updated_at
        - install_count
        - manifest_sha256
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        author:
          type: string
        icon_url:
          type: [string, "null"]
          format: uri
        latest_version:
          type: string
        updated_at:
          type: string
          format: date-time
        install_count:
          type: integer
          minimum: 0
        manifest_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UpdateCheckRequest:
      type: object
      required: [platform, app_version, plugins]
      properties:
        platform:
          type: string
          enum: [ios, tvos]
        app_version:
          type: string
          example: 1.4.0
        plugins:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: object
            required: [id, version]
            properties:
              id:
                type: string
              version:
                type: string
    UpdateCheckResponse:
      type: object
      required: [items, update_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateCheckResult"
        update_count:
          type: integer
          minimum: 0
    UpdateCheckResult:
      type: object
      required:
        - id
        - current_version
        - latest_version
        - update_available
        - status
        - manifest
        - manifest_sha256
      properties:
        id:
          type: string
        current_version:
          type: string
        latest_version:
          type: [string, "null"]
        update_available:
          type: boolean
        status:
          type: string
          enum: [update_available, up_to_date, incompatible, not_found]
        manifest:
          type: [object, "null"]
          description: Present only when status is update_available
          additionalProperties: true
        manifest_sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
    AdminPluginPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Plugin"
              - type: object
                required:
                  - manifest
                  - platforms
                  - minimum_ios_version
                  - minimum_tvos_version
                properties:
                  manifest:
                    type: object
                    additionalProperties: true
                  platforms:
                    type: array
                    items:
                      type: string
                      enum: [ios, tvos]
                  minimum_ios_version:
                    type: [string, "null"]
                  minimum_tvos_version:
                    type: [string, "null"]
        next_cursor:
          type: [string, "null"]
    InstallEvent:
      type: object
      required:
        - event_id
        - plugin_id
        - installation_id
        - action
        - app_version
        - platform
        - occurred_at
      properties:
        event_id:
          type: string
          format: uuid
        plugin_id:
          type: string
        installation_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [install, update, uninstall]
        from_version:
          type: [string, "null"]
        to_version:
          type: [string, "null"]
        app_version:
          type: string
        platform:
          type: string
          enum: [ios, tvos]
        occurred_at:
          type: string
          format: date-time
    PublishRequest:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: object
          description: For new user submissions, id is generated and overwritten by the server. update_time is always generated by the server.
          required: [type, name, desc, author, version]
          additionalProperties: true
        visibility:
          type: string
          enum: [public, private]
          default: public
          description: Fixed when a plugin is first created. Private plugins cannot be submitted for review.
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ios, tvos]
          default: [ios, tvos]
        minimum_ios_version:
          type: [string, "null"]
        minimum_tvos_version:
          type: [string, "null"]
    PluginImportRequest:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: "#/components/schemas/ImportManifest"
              - type: object
                required: [manifest]
                properties:
                  manifest:
                    $ref: "#/components/schemas/ImportManifest"
                  visibility:
                    type: string
                    enum: [public, private]
                    default: public
                  platforms:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      type: string
                      enum: [ios, tvos]
                  minimum_ios_version:
                    type: [string, "null"]
                  minimum_tvos_version:
                    type: [string, "null"]
    ImportManifest:
      type: object
      required: [type, name, desc, version]
      description: id, author, and update_time may be present but are always ignored.
      properties:
        type:
          type: string
        name:
          type: string
        desc:
          type: string
        version:
          type: string
      additionalProperties: true
    PluginImportResponse:
      type: object
      required: [items, imported_count]
      properties:
        items:
          type: array
          items:
            type: object
            required: [plugin_id, status, visibility, saved_at]
            properties:
              plugin_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [draft, private]
              visibility:
                type: string
                enum: [public, private]
              saved_at:
                type: string
                format: date-time
        imported_count:
          type: integer
          minimum: 1
          maximum: 100
    DraftSubmissionResponse:
      type: object
      required: [items, submitted_count]
      properties:
        items:
          type: array
          items:
            type: object
            required: [submission_id, plugin_id, status]
            properties:
              submission_id:
                type: string
                format: uuid
              plugin_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [pending, accepted]
        submitted_count:
          type: integer
          minimum: 0
        published_count:
          type: integer
          minimum: 0
          description: Present when a whitelisted user publishes the drafts directly.
    AdminUser:
      type: object
      required: [id, email, nick, created_at, whitelisted, contribution_count, contribution_points]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nick:
          type: string
        created_at:
          type: string
          format: date-time
        whitelisted:
          type: boolean
        contribution_count:
          type: integer
          minimum: 0
          description: Number of distinct plugins with an accepted submission.
        contribution_points:
          type: integer
          minimum: 0
          description: Contribution points earned from accepted plugins and resources.
    AdminUserStats:
      type: object
      required: [total_users, whitelisted_users, top_contributors]
      properties:
        total_users:
          type: integer
          minimum: 0
        whitelisted_users:
          type: integer
          minimum: 0
        top_contributors:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AdminUser"
    AdminUserPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminUser"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
